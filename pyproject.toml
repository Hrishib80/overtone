[project]
name = "overtone"
version = "0.2.0"
description = "Campus dating by pairwise comparison"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
# So a bare `pytest` imports `backend` the way `python -m pytest` does; CI runs the former.
pythonpath = ["."]
asyncio_mode = "strict"
addopts = "-q --strict-markers"
filterwarnings = [
    "error::DeprecationWarning:backend.*",
]

[tool.ruff]
line-length = 110
target-version = "py312"
exclude = ["alembic/versions", "node_modules", "dist"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "S", "C4", "RET", "SIM"]
ignore = [
    "S101",  # assert — the test suite is built on it
    "B008",  # function call in default arg — how FastAPI dependencies are declared
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]  # hard-coded test credentials are the point
"alembic/env.py" = ["E402"]   # imports follow Alembic's required setup order
"tests/conftest.py" = ["E402"] # env must be set before backend imports
"backend/pairing.py" = ["S311"] # anchor/segment sampling is algorithmic variety, not security
"tests/test_pairing.py" = ["S311"] # seeded random.Random for reproducible pair-generation tests
# Dev-only seeding CLI: the demo password is the point, the RNG is seeded for
# reproducible fake data, and blocking file writes are fine in a one-shot script.
"scripts/seed_demo.py" = ["S105", "S311", "ASYNC240"]
"scripts/calibrate.py" = ["S311"]      # seeded Monte Carlo, not a secret
